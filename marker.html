<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Variant 14 AR Marker</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;

            text-align: center;
        }

            image-rendering: auto;

            margin-top: 18px;
            color: #334155;
        }

<body>
    <main>
        <img src="./assets/pattern-14.png" alt="Variant 14 AR registration marker">
        <p>Open this page on a desktop screen or print this marker, then point the phone camera at it.</p>

</html>
