<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Control Task — AR Registration Template</title>

    <!-- The same AR.js/A-Frame connection style as in the working example. -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script defer src="./control-task.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="ui-panel">
        <h1>Control Task — AR registration template</h1>
        <p>
            Variant 14 marker is used as a unique registration pattern. Point the phone camera at
            <strong>marker.html</strong> opened on the laptop screen.
        </p>
        <p id="trackingStatus" class="status">Searching for marker...</p>
    </div>

    <a-scene
        embedded
        renderer="alpha: true; antialias: true; logarithmicDepthBuffer: true"
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; maxDetectionRate: 30;">

        <a-marker
            id="variantMarker"
            type="pattern"
            url="./assets/pattern-14.patt"
            smooth="true"
            smoothCount="8"
            smoothTolerance="0.01"
            smoothThreshold="4"
            emitevents="true">

            <!-- Same DROP surface from PA#1/PA#2, now aligned to marker 14. -->
            <a-entity
                id="dropSurface"
                drop-surface
                position="0 0.06 0"
                rotation="0 0 0"
                scale="0.28 0.28 0.28">
            </a-entity>

            <a-ring
                position="0 0.012 0"
                rotation="-90 0 0"
                radius-inner="0.50"
                radius-outer="0.54"
                color="#38bdf8"
                material="transparent: true; opacity: 0.75">
            </a-ring>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
