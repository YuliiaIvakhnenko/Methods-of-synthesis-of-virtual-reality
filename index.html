<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Control Task — AR Registration Template</title>

    <!-- Same simple AR.js setup style as in the provided working example. -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="./control-task.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="trackingStatus" class="status">Searching for marker...</div>

    <a-scene
        embedded
        renderer="alpha: true; antialias: true; logarithmicDepthBuffer: true"
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best; maxDetectionRate: 30;">

        <a-marker
            id="variantMarker"
            type="pattern"
            url="./assets/pattern-14.patt"
            smooth="true"
            smoothCount="20"
            smoothTolerance="0.001"
            smoothThreshold="8"
            emitevents="true">

            <!-- DROP surface from PA#1/PA#2, normalized and fixed above marker 14. -->
            <a-entity
                id="dropSurface"
                drop-surface
                position="0 0.50 0"
                rotation="0 0 0"
                scale="1 1 1">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
